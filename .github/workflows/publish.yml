name: Publicar no npm

# Publica @squord/bot no npm a partir de um Release do GitHub.
#
# Pré-requisito (uma única vez): o secret NPM_TOKEN no repositório,
# criado com um token de automação (npmjs.com → Access Tokens → Automation
# ou Granular com permissão de escrever em @squord/bot):
#
#   gh secret set NPM_TOKEN --org Squord --repo Squord/squord-bot-sdk
#
# Fluxo de release:
#   1. Atualize packages/bot/package.json e CHANGELOG.md
#   2. Commit e tag: git tag v0.1.0 && git push --tags
#   3. Crie o Release do GitHub — este workflow publica no npm com provenance

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Build e npm publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Publicar @squord/bot
        working-directory: packages/bot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Resumo
        run: |
          echo "✅ Publicado:"
          npm view @squord/bot version --registry https://registry.npmjs.org/
